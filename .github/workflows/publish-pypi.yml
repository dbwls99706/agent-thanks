name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify distributions
        run: |
          set -eu
          tar tzf dist/*.tar.gz > sdist-contents.txt
          if ! grep -q 'examples/session\.jsonl$' sdist-contents.txt; then
            echo "error: the source distribution ships no examples/session.jsonl"
            cat sdist-contents.txt
            exit 1
          fi
          python -m venv smoke
          smoke/bin/python -m pip install --no-index --find-links dist agent-thanks
          smoke/bin/agent-thanks --version
          smoke/bin/agent-thanks --help
          smoke/bin/agent-thanks thanks --help
          smoke/bin/agent-thanks demo
          smoke/bin/agent-thanks thanks --repo . --offline --dry-run --output smoke-report.json
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(smoke/bin/agent-thanks --version | awk '{print $2}')"
          if [ "$tagged" != "$packaged" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match packaged version $packaged"
            exit 1
          fi
          echo "ok: $GITHUB_REF_NAME matches packaged version $packaged"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-thanks
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
