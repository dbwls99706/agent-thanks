name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: agent-thanks --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir sdist
      - name: Verify the sdist ships the bundled example
        run: |
          tar tzf sdist/*.tar.gz > sdist-contents.txt
          if ! grep -q 'examples/session\.jsonl$' sdist-contents.txt; then
            echo "error: the source distribution ships no examples/session.jsonl"
            cat sdist-contents.txt
            exit 1
          fi
          echo "ok: examples/session.jsonl is in the source distribution"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m venv smoke
      - run: smoke/bin/python -m pip install --no-index --find-links dist agent-thanks
      - run: smoke/bin/agent-thanks --version
      - run: smoke/bin/agent-thanks demo
      - run: smoke/bin/agent-thanks scan --repo . --offline --output smoke-report.json
      - run: smoke/bin/agent-thanks export smoke-report.json --output smoke-report.md
