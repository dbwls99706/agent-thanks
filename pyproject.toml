[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-thanks"
version = "0.5.0"
description = "Detect and thank open-source repositories meaningfully used during an AI coding session."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yujin Hong" }]
keywords = ["ai-agents", "github", "open-source", "attribution", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/dbwls99706/agent-thanks"
Changelog = "https://github.com/dbwls99706/agent-thanks/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dbwls99706/agent-thanks#readme"
Issues = "https://github.com/dbwls99706/agent-thanks/issues"
Source = "https://github.com/dbwls99706/agent-thanks"

[project.scripts]
agent-thanks = "agent_thanks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["agent_thanks"]
